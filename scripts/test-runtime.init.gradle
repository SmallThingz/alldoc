gradle.projectsEvaluated {
  def app = gradle.rootProject.project(':app')
  app.tasks.register('writeLocalTestRuntime') {
    dependsOn {
      def testTask = app.tasks.getByName('testDebugUnitTest')
      testTask.taskDependencies.getDependencies(testTask)
    }
    doLast {
      def testTask = app.tasks.getByName('testDebugUnitTest')
      def output = new File(app.buildDir, 'local-test-runtime.json')
      output.text = groovy.json.JsonOutput.toJson([
        classpath: testTask.classpath.asPath,
        properties: testTask.systemProperties,
        jvmArgs: testTask.jvmArgs,
        workingDir: testTask.workingDir.absolutePath
      ])
      println('Wrote local test runtime metadata')
    }
  }
}
